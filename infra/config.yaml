# Single source of truth for infra static config (Terraform). Read by every root under
# infra/envs/<root>/ via `yamldecode(file(...))` into locals; modules receive these as explicit
# inputs (no implicit module defaults for config values).
#
# NOT here (different mechanism / consumer):
#   - Terraform state-bucket names        → each infra/envs/<root>/backend.tf (TF forbids
#                                            interpolation in the backend block)
#   - app runtime settings                → infra/envs/<env>/<env>.env  (read by the Lambda at
#                                            cold start and by vite at build)
#   - server-side secret VALUES           → AWS Secrets Manager (out of IaC, §10.3)
# See the spec §10.9 (Settings inventory) for the full app-vs-infra settings map.

project:         holahost
aws_region:      eu-west-3
frontend_bucket: holahost-frontend
domain:          hola.host
alert_email:     kaxcheg@gmail.com # per-env SNS alarm topics subscribe this one address (I-13)
github_owner:    kaxcheg           # github provider owner + prod deploy reviewer (I-14, repo root)

# Data files s3_frontend publishes to the frontend bucket (paths relative to the repo root; the root
# resolves them). guidebook_template → config/template_schema.json (§10.6); sample_guidebook →
# config/sample_guidebook.md (§8.6); sample_messages → config/sample_messages.json (US-01/F-20, I-18).
guidebook_template_path: docs/guidebook_template.json
sample_guidebook_path:   docs/sample_guidebook.md
sample_messages_path:    docs/sample_messages.json

# Published S3 object keys (single source — s3_frontend publishes to these; the Lambda reads them, no
# drifting literals in the roots). sample_guidebook and sample_messages are public (CloudFront
# /config/*; sample_messages is frontend-only — the Lambda does not read it); system_prompt is
# private (no CloudFront behavior) and per-env — its key lives explicitly under envs.<env>.system_prompt_key.
sample_guidebook_key: config/sample_guidebook.md
sample_messages_key:  config/sample_messages.json

# Email-auth DNS (SPF/DKIM/DMARC): keyed by a free-form label, record name in `name` (several types
# can share one name — Resend's MX + SPF TXT both sit on send.<domain>). Empty until Resend is set
# up (I-16), then filled here and re-applied by the `shared` root; see infra/README.md "Resend".
email_dns_records: {}

envs:
  staging:
    name_prefix:             holahost-staging
    subdomain:               staging.hola.host
    recovery_window_in_days: 0 # staging: recreate secrets freely while iterating
    price_class:             PriceClass_100
    system_prompt_key:       system-prompt/staging.md    # private S3 key (no CloudFront behavior)
    system_prompt_path:      docs/staging_system_prompt.md # seed; live-editable in S3 (ignore_changes), read at cold start (D-30)
    lambda_api_memory_mb:     2048 # embedding model baked in image → needs RAM
    lambda_api_timeout_s:     60   # LLM_TIMEOUT_SECONDS=30 + margin
    lambda_cleanup_memory_mb: 512
    lambda_cleanup_timeout_s: 120
    log_retention_days:       14
  prod:
    name_prefix:             holahost-prod
    subdomain:               hola.host
    recovery_window_in_days: 30 # prod: 30-day recovery window
    price_class:             PriceClass_100
    system_prompt_key:       system-prompt/prod.md    # private S3 key (no CloudFront behavior)
    system_prompt_path:      docs/prod_system_prompt.md # seed; live-editable in S3 (ignore_changes), read at cold start (D-30)
    lambda_api_memory_mb:     2048
    lambda_api_timeout_s:     60
    lambda_cleanup_memory_mb: 512
    lambda_cleanup_timeout_s: 120
    log_retention_days:       30

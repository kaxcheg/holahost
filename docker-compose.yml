name: holahost

# Local dev stack (spec §12.1): Postgres (replaces Neon) + Mailpit (replaces Resend) + the backend
# running under the AWS Lambda Runtime Interface Emulator. Vite dev-server runs separately on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: holahost
      POSTGRES_PASSWORD: holahost
      POSTGRES_DB: holahost
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holahost -d holahost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    expose: ["1025"]   # SMTP — reached by the api over the compose network (mailpit:1025); not published to host
    ports:
      - "8025:8025"    # web UI → http://localhost:8025

  api:
    build:
      context: .
      dockerfile: holahost/services/lead-capture/backend/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}   # sourced from .tool-versions by `make dev-up`
    image: holahost-api:dev
    env_file: [holahost/services/lead-capture/envs/dev.env, holahost/frontend/.env]   # service dev config (gitignored) + frontend-owned magic-link contract (D-21)
    environment:
      # the one real secret — supplied from the shell by `make dev-up` (prompt); empty otherwise.
      SAMPLE_SERVER_API_KEY: ${SAMPLE_SERVER_API_KEY:-}
    volumes:
      # business content — mounted (not baked) so it's editable without a rebuild; prod reads it from S3.
      - ./holahost/services/lead-capture/docs/sample_guidebook.md:/var/task/docs/sample_guidebook.md:ro
    ports: ["9000:8080"]        # Lambda RIE invoke endpoint
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

volumes:
  pgdata:

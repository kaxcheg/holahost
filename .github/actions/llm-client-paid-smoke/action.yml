name: llm-client paid smoke
description: >
  One real generation through the deployed llm-client: a service token from auth, then one
  `POST /api/llm-client/generate` on the `fast` alias with `max_tokens: 1`. It checks what the free
  health loop cannot — the provider key, the registry and the accounting path of a live call — and it
  costs money, so it runs exactly once: no loop, no retry. A failed call fails the deploy; re-running
  the job is the retry, and a person decides on it — so a failure prints the answer's status and
  error envelope, and every run prints the request id to find the call's `op_completed` by.

  The pipeline holds no provider key (B-2): the call goes through the service, as a caller of its
  own, with a client registered in auth whose allowed audiences include `llm-client`. The token
  request is the frame spec's S2S `client_credentials`, form-encoded as RFC 6749 defines it, sent to
  the issuer the service itself trusts — `EXPECTED_ISSUER` in the environment's .env, so the two
  cannot point at different hosts.
inputs:
  base-url:
    description: The environment's gateway, e.g. https://staging.hola.host.
    required: true
  env-file:
    description: The environment's .env, relative to the repo root; its EXPECTED_ISSUER is auth.
    required: true
  client-id:
    required: true
  client-secret:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        ENV_FILE: ${{ inputs.env-file }}
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
      run: |
        set -euo pipefail
        issuer=$(sed -n 's/^EXPECTED_ISSUER=//p' "$ENV_FILE")
        if [ -z "$issuer" ]; then
          echo "::error::no EXPECTED_ISSUER in $ENV_FILE"
          exit 1
        fi

        # -S keeps curl's own error line under -s; --fail-with-body keeps the error envelope that
        # plain -f discards. --max-time bounds each call: a hung connection must fail the step, not
        # hold the job until GitHub's limit.
        if ! token_response=$(curl -sS --fail-with-body --connect-timeout 5 --max-time 30 \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode audience=llm-client \
            "$issuer/token"); then
          echo "::error::auth refused the smoke client's token request"
          echo "$token_response"
          exit 1
        fi
        token=$(jq -er .access_token <<< "$token_response")
        echo "::add-mask::$token"

        # No X-Request-ID of our own: the gateway attaches it, and the service echoes it back.
        headers="$RUNNER_TEMP/llm-client-smoke-headers"
        status=0
        response=$(curl -sS --fail-with-body --connect-timeout 5 --max-time 120 -D "$headers" \
          -H "Authorization: Bearer $token" \
          -H 'Content-Type: application/json' \
          -d '{"model": "fast", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 1}' \
          "$BASE_URL/api/llm-client/generate") || status=$?
        grep -i '^x-request-id:' "$headers" || true
        if [ "$status" -ne 0 ]; then
          echo "::error::the generation smoke failed — do not re-run before reading the answer below"
          echo "$response"
          exit 1
        fi
        # The figures, not the text: they are what the check is about.
        jq -e '{provider, model, usage}' <<< "$response"

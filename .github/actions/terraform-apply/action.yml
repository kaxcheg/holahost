name: Terraform apply
description: >
  terraform init + apply -auto-approve, for one root. Each environment is its own directory
  (infra/envs/{staging,prod}/, plus the shared infra/common/) — not a Terraform workspace, so
  there's nothing to select here. AWS credentials must already be configured
  (aws-actions/configure-aws-credentials) before calling this.
inputs:
  working-directory:
    description: Path to the Terraform root, relative to the repo root.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform init
        terraform apply -auto-approve

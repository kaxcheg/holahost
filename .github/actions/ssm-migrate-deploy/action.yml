name: SSM migrate and deploy
description: >
  Syncs docker-compose.yml and the environment's .env file to the target instance, then runs
  `python -m alembic upgrade head` followed by `docker compose up -d`, using the given image.
  Migrations always run before the container swap (recreate strategy). AWS credentials must
  already be configured.

  The SSM command is sent, then polled to completion (`aws ssm wait command-executed`) — this
  step's own exit code reflects whether the remote script actually succeeded, not just whether
  AWS accepted the command into its queue (`send-command` alone returns immediately either way).
  Remote stdout/stderr are always printed to the job log, on success or failure.

  Both files are embedded directly in the SSM command payload (base64-encoded) rather than fetched
  from anywhere external. The pipeline already has them checked out and already authenticates to
  this exact instance over OIDC, so adding git-on-instance or S3 staging would buy nothing for a
  couple of KB of text. The relevant SendCommand limit is the whole SSM document at 64 KB
  (`MaxDocumentSizeExceeded`), which both files together are nowhere near.

  No password goes in either embedded file (neither is allowed to carry secrets — see
  `infra/envs/<env>/main.tf`'s value-less secrets). The remote script fetches both itself, on the
  instance, via its own instance role — the same permission the `api` container already needs for
  its own independent fetch (`scripts/bootstrap.py`):

    - `db-superuser-password` — the `postgres` container's bootstrap superuser. Feeds
      `postgres`'s own initdb via Compose's `${POSTGRES_SUPERUSER_PASSWORD}` interpolation, and
      the two one-off `api` containers below, both of which are elevated operations that bypass
      `scripts.bootstrap` and read that pair directly (`migrations/env.py`,
      `scripts/provision_app_role.py`).
    - `db-password` — the app role's own password. Needed only by the provisioning step, which is
      what actually sets it on the role.

  They must be different values: the app role is unprivileged precisely so that it cannot bypass
  row-level security, and sharing one password with the superuser would hand that bypass to
  anything holding the app's credentials. See docker-compose.yml's `postgres` service.

  USER/DB come straight from the synced `.env`, via `docker-compose.yml`'s own `env_file:` key on
  the `postgres`/`api` services — not threaded through this script (same file
  `scripts/bootstrap.py` itself reads from for the `api` container's own `Settings`).

  Three remote steps, in order: migrate as the superuser, provision the app role, then swap the
  containers. The middle step is not optional bookkeeping — it is what applies a rotated
  `db-password` to the Postgres role. Nothing else in the stack ever changes that role's password
  (the `postgres` image applies it at initdb only, and the `pgdata` volume outlives every
  restart), so rotating the secret takes effect on the next *deploy*; an `api` restart alone would
  only change which password the client offers, and every connection would then fail to
  authenticate.
inputs:
  env:
    description: Environment name (staging/prod) — used to look up the instance-id SSM parameter.
    required: true
  service-name:
    required: true
  image:
    description: Image digest/URI to deploy (repo@sha256:...).
    required: true
  compose-file:
    description: Path to docker-compose.yml, relative to the repo root.
    required: true
  env-file:
    description: Path to the environment's .env file, relative to the repo root.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        INSTANCE_ID=$(aws ssm get-parameter --name "/holahost/${{ inputs.env }}/instance-id" --query Parameter.Value --output text)
        REMOTE_DIR="/opt/services/${{ inputs.service-name }}"
        # Same relative shape as the source repo (infra/envs/<env>/.env next to the compose file)
        # so the compose file's own `env_file: [infra/envs/${ENV:?...}/.env]` resolves identically
        # here and locally — only ENV picks which folder. Below, `--env-file` (Compose's own CLI
        # flag, unrelated to that YAML `env_file:` key) points at this exact same synced file, so
        # its `ENV=<env>` line supplies `${ENV}` for that interpolation too — no separate `ENV=`
        # var needs setting on either docker compose line.
        ENV_SUBDIR="infra/envs/${{ inputs.env }}"
        COMPOSE_B64=$(base64 -w0 < "${{ inputs.compose-file }}")
        ENV_B64=$(base64 -w0 < "${{ inputs.env-file }}")
        SECRET_ID="holahost/${{ inputs.env }}/rag-documents/db-password"
        SUPERUSER_SECRET_ID="holahost/${{ inputs.env }}/rag-documents/db-superuser-password"
        # No PYTHON_VERSION here: docker-compose.yml's `api` service carries no `build:`
        # section, so Compose never needs it.

        # One array element, not several: AWS does not document whether `commands` entries share
        # shell state, so a single multi-line script sidesteps the question — `$PGPW` and
        # `set -e`'s fail-fast both work by ordinary bash semantics inside one script.
        #
        # `docker compose run --rm api ...` rather than a bare `docker run`: `compose run` joins
        # the project's own network, and through `postgres`'s `depends_on:
        # condition: service_healthy` it creates and waits for `postgres` when it is not already
        # running. That is what makes the very first deploy work, where neither the network nor
        # the database container exists yet. It also does not collide with an already-running
        # `api` container on a redeploy, because `compose run` publishes no service ports.
        #
        # `-e POSTGRES_SUPERUSER_PASSWORD=...` on each `run` command AND the same variable
        # exported for the whole script — two different consumers. The exported one feeds
        # `postgres`'s `environment: {POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}}` through
        # Compose's interpolation, which is parsed for the whole file even though only `api` runs.
        # The `api` service itself has no mechanism to receive a host CLI variable — it has only
        # `env_file:`, and the synced .env never carries a password. The long-running container
        # does not need one, because it fetches its own from Secrets Manager before `Settings` is
        # built; but both invocations below override the container's CMD and bypass that fetch, so
        # `docker compose run`'s own `-e` is their only way in.
        #
        # Every secret is quoted at its point of use (`-e "VAR=\$PW"`) and otherwise passed as an
        # `export VAR=\$PW` assignment — both forms are immune to word splitting and globbing. An
        # unquoted `-e VAR=\$PW` in ordinary argument position is not: a password containing a
        # space becomes two arguments (`no such service: ...`), and one containing `*` or `?`
        # globs against the remote working directory, silently handing the container something
        # other than the secret.
        REMOTE_SCRIPT=$(cat <<EOF
        set -e
        mkdir -p $REMOTE_DIR/$ENV_SUBDIR
        echo $COMPOSE_B64 | base64 -d > $REMOTE_DIR/docker-compose.yml
        echo $ENV_B64 | base64 -d > $REMOTE_DIR/$ENV_SUBDIR/.env
        cd $REMOTE_DIR
        PGPW=\$(aws secretsmanager get-secret-value --secret-id $SECRET_ID --query SecretString --output text)
        SUPERPW=\$(aws secretsmanager get-secret-value --secret-id $SUPERUSER_SECRET_ID --query SecretString --output text)
        export IMAGE=${{ inputs.image }}
        export POSTGRES_SUPERUSER_PASSWORD=\$SUPERPW
        docker compose --env-file $ENV_SUBDIR/.env run --rm -e "POSTGRES_SUPERUSER_PASSWORD=\$SUPERPW" api python -m alembic upgrade head
        docker compose --env-file $ENV_SUBDIR/.env run --rm -e "POSTGRES_SUPERUSER_PASSWORD=\$SUPERPW" -e "POSTGRES_PASSWORD=\$PGPW" api python -m scripts.provision_app_role
        docker compose --env-file $ENV_SUBDIR/.env up -d
        EOF
        )

        # jq builds the request JSON (quoting/newlines/backslashes all handled by `--arg`,
        # not by hand) — the one manual escape above (`\$`) is the only thing left to get
        # right by inspection, versus escaping every line of the script by hand into an
        # inline --parameters string.
        jq -n --arg instance "$INSTANCE_ID" --arg script "$REMOTE_SCRIPT" \
          '{InstanceIds: [$instance], DocumentName: "AWS-RunShellScript", Parameters: {commands: [$script]}}' \
          > /tmp/ssm-command.json

        # send-command is fire-and-forget: it returns as soon as AWS accepts the command into its
        # queue, not once the remote script finishes. Polling is what makes this step's exit code
        # mean anything — without it a failed migration would leave the old container running, and
        # the pipeline's later smoke check would curl that still-healthy old container and report
        # the deploy green. `aws ssm wait command-executed` blocks until the invocation reaches a
        # terminal state and exits non-zero unless that state is Success.
        COMMAND_ID=$(aws ssm send-command --cli-input-json file:///tmp/ssm-command.json --query 'Command.CommandId' --output text)
        echo "SSM command sent: $COMMAND_ID"

        set +e
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
        WAIT_STATUS=$?
        set -e

        echo "--- remote script stdout ---"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
        echo "--- remote script stderr ---"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true

        if [ "$WAIT_STATUS" -ne 0 ]; then
          echo "SSM command did not complete successfully (wait command-executed exited $WAIT_STATUS) — failing the deploy." >&2
          exit 1
        fi

name: rag-documents-deploy-staging

on:
  push:
    branches: ["release/v*"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          # ACCOUNT_ID and the IAM role do not exist yet: both wait on the platform-level AWS
          # account and OIDC provider. Fill in once those land.
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-rag-documents-staging
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: holahost/services/rag-documents/infra/common

      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: holahost/services/rag-documents/infra/envs/staging

      # Only a sha tag here. A version tag derived from the branch name cannot survive its own
      # trigger: this workflow runs on every push to `release/v*`, a release branch takes
      # stabilization commits after the first, and the ECR repository is immutable for everything
      # but `latest*` — so the second push would re-push an already-taken tag and fail the build.
      # The version tag is applied once instead, by promote-prod, onto the digest that ships.
      - name: Compute image tag
        id: tags
        run: |
          echo "repo_url=$(terraform -chdir=holahost/services/rag-documents/infra/common output -raw repository_url)" >> "$GITHUB_OUTPUT"
          # The full sha, not the first seven characters: in a growing repository a short prefix
          # carries a non-zero chance of collision for no benefit, and this tag is the only thing
          # binding an image to its commit when promote-prod later looks it up.
          echo "sha_tag=git-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-push-image
        id: build
        with:
          dockerfile: holahost/services/rag-documents/Dockerfile
          ecr-repo-url: ${{ steps.tags.outputs.repo_url }}
          sha-tag: ${{ steps.tags.outputs.sha_tag }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/ssm-migrate-deploy
        with:
          env: staging
          service-name: rag-documents
          image: ${{ steps.build.outputs.digest }}
          compose-file: holahost/services/rag-documents/docker-compose.yml
          env-file: holahost/services/rag-documents/infra/envs/staging/.env

      # A cold volume downloads the embedding model on first boot, so the check is retried within
      # a window rather than run once.
      - uses: ./.github/actions/smoke-check
        with:
          url: https://staging.hola.host/api/rag-documents/health

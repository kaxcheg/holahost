name: rag-documents-deploy-staging

on:
  push:
    branches: ["release/v*"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          # ACCOUNT_ID and the IAM role do not exist yet: both wait on the platform-level AWS
          # account and OIDC provider. Fill in once those land.
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-rag-documents-staging
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: holahost/services/rag-documents/infra/common

      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: holahost/services/rag-documents/infra/envs/staging

      # Only a sha tag. A `release-<branch>` tag derived from GITHUB_REF used to be computed here
      # too, and it could not survive its own trigger: this workflow runs on EVERY push to
      # `release/v*`, a GitFlow release branch takes stabilization commits after the first one,
      # and the ECR repo is immutable for everything but `latest*` — so the second push onto the
      # same branch would re-push an identical, already-taken tag and fail the build. The version
      # tag is applied once instead, by promote-prod, onto the digest that actually ships.
      - name: Compute image tag
        id: tags
        run: |
          echo "repo_url=$(terraform -chdir=holahost/services/rag-documents/infra/common output -raw repository_url)" >> "$GITHUB_OUTPUT"
          # Полный sha, не первые 7 символов: короткий префикс в растущем репозитории даёт
          # ненулевой шанс коллизии при нулевой выгоде, а тег — единственная привязка образа
          # к коммиту, по которой его потом находит промоут.
          echo "sha_tag=git-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-push-image
        id: build
        with:
          dockerfile: holahost/services/rag-documents/Dockerfile
          ecr-repo-url: ${{ steps.tags.outputs.repo_url }}
          sha-tag: ${{ steps.tags.outputs.sha_tag }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/ssm-migrate-deploy
        with:
          env: staging
          service-name: rag-documents
          image: ${{ steps.build.outputs.digest }}
          compose-file: holahost/services/rag-documents/docker-compose.yml
          env-file: holahost/services/rag-documents/infra/envs/staging/.env

      # Cold volume downloads the embedding model on first boot (R-30's own backlog wording,
      # "smoke с ожиданием прогрева модели") — retried with a window, not one-shot.
      - uses: ./.github/actions/smoke-check
        with:
          url: https://staging.hola.host/api/rag-documents/health

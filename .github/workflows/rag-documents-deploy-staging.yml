name: rag-documents-deploy-staging

# The trigger and this service's values; the pipeline is service-deploy-staging.yml.

on:
  push:
    branches: ["release/v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/service-deploy-staging.yml
    with:
      service: rag-documents

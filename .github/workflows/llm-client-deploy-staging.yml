name: llm-client-deploy-staging

# The trigger and this service's values; the pipeline is service-deploy-staging.yml.

on:
  push:
    branches: ["release/v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/service-deploy-staging.yml
    with:
      service: llm-client
      # One real generation after the health loop: it checks the provider key, the registry and
      # the accounting path of a live call, which health cannot — and it costs money, which is why
      # it is the cheapest alias with a one-token ceiling. The registry keeps `fast` resolvable
      # (`make validate-registry`).
      smoke-path: /generate
      smoke-body: '{"model": "fast", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 1}'
      smoke-summary: "{provider, model, usage}"
      smoke-secret-prefix: LLM_CLIENT

name: rag-documents-ci

# Frame spec: root .github/workflows/ holds thin trigger-stubs `<svc>-*.yml`, path-filtered to the
# service. GitHub only scans this one repo-root directory for triggerable/reusable workflows (no
# nested services/rag-documents/.github/workflows/ — see .build-state/.../clarifications.md), and
# a top-level `on.paths` filter leaves a required check permanently pending when skipped, so the
# path check is a job-internal step instead, with the job always completing (green) either way.
# Repeated steps (toolchain setup) are shared composite actions under .github/actions/ — the only
# thing GitHub's platform pins to this repo-root directory is the trigger-bearing workflow file
# itself, not the step logic it runs (see .github/actions/*/action.yml, shared across services).

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: ["feature/**", "bugfix/**", "refactor/**", "chore/**", "docs/**", "test/**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — needed for the diff-based path filter below

      - name: Detect rag-documents changes
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^holahost/(services/rag-documents|libs/holahost-auth)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-python-toolchain
        if: steps.filter.outputs.changed == 'true'

      # The repo-root .pre-commit-config.yaml's 4 local Python hooks (ruff/ruff-format/mypy/
      # import-linter) have `pass_filenames: false` — each one unconditionally loops over *every*
      # package under holahost/ with its own pyproject.toml (currently rag-documents/backend and
      # holahost-auth) and runs `poetry run <tool>` inside it, regardless of which files this PR
      # actually touched. On a developer's machine both venvs already have their deps installed
      # from ordinary local work; a fresh CI runner has neither — `poetry run` finds an empty venv
      # it just silently created and reports "Command not found: ruff/mypy/lint-imports" for both
      # packages. Found for real: this is the first live run of this exact workflow file (prior
      # rounds only got as far as YAML-syntax checks — see .build-state/.../clarifications.md),
      # and it failed on exactly this. Installing both packages' deps before the pre-commit step
      # (not after, and not just rag-documents' own, matching what the hooks themselves loop
      # over) fixes it; the `poetry install` that used to live inside "Unit tests" below is now
      # redundant there and removed.
      - name: Install dependencies (rag-documents backend)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: poetry install

      - name: Install dependencies (holahost-auth)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/libs/holahost-auth
        run: poetry install

      - name: Pre-commit (this service's + holahost-auth's changed files)
        if: steps.filter.outputs.changed == 'true'
        run: |
          pip install pre-commit
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base" 2>/dev/null || base="$(git rev-list --max-parents=0 HEAD)"
          pre-commit run --files $(git diff --name-only "$base" HEAD -- holahost/services/rag-documents holahost/libs/holahost-auth)

      - name: Unit tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: poetry run pytest -m "not integration"

      - name: Integration tests (testcontainers — needs Docker)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: poetry run pytest -m integration

      - name: Docker build (no push)
        if: steps.filter.outputs.changed == 'true'
        run: |
          PYTHON_VERSION=$(awk '$1=="python"{print $2}' .tool-versions)
          docker build -f holahost/services/rag-documents/Dockerfile \
            --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
            -t rag-documents:ci .

      - uses: hashicorp/setup-terraform@v3
        if: steps.filter.outputs.changed == 'true'

      # `validate` only, not a real `terraform plan`: a real plan needs read access to the
      # platform's S3 state backend + provider APIs, i.e. its own read-only AWS OIDC role — which,
      # like the deploy/promote roles, depends on the platform AWS account that doesn't exist yet
      # (see .build-state/.../clarifications.md scope-boundary note). Upgrade to a real
      # `terraform plan` once that role exists; `validate` is what's honestly achievable today.
      - name: Terraform validate (common)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/infra/common
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (envs/staging)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/infra/envs/staging
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (envs/prod)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/infra/envs/prod
        run: terraform init -backend=false && terraform validate

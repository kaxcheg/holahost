name: rag-documents-ci

# Frame spec: root .github/workflows/ holds thin trigger-stubs `<svc>-*.yml`, path-filtered to the
# service. GitHub only scans this one repo-root directory for triggerable/reusable workflows, and
# a top-level `on.paths` filter leaves a required check permanently pending when skipped, so the
# path check is a job-internal step instead, with the job always completing (green) either way.
# Repeated steps (toolchain setup) are shared composite actions under .github/actions/ — the only
# thing GitHub's platform pins to this repo-root directory is the trigger-bearing workflow file
# itself, not the step logic it runs (see .github/actions/*/action.yml, shared across services).

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: ["feature/**", "bugfix/**", "refactor/**", "chore/**", "docs/**", "test/**"]

permissions:
  contents: read
  # For the OIDC token the `terraform plan` steps exchange for the read-only AWS role. Every
  # other step needs nothing beyond `contents: read`, so the grant stays at the minimum that
  # lets the one step that needs it work.
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — needed for the diff-based path filter below

      # The filter covers the pipeline itself, not only the code it builds: a PR touching
      # just .github/actions/, a workflow file, .pre-commit-config.yaml or .tool-versions
      # would otherwise report green having built nothing. `holahost/make` and
      # `holahost/infra/modules` are matched for the same reason one step further out — this
      # service's Makefile is an `include`, and its Terraform roots are calls into those
      # modules.
      #
      # Every library under `holahost/libs/` is matched, not only the ones this service imports
      # today: the service runs on that code, so a library change has to re-run this pipeline
      # against it — that run is what checks a dependent service. Matching all of them costs an
      # extra run now and then; matching a list costs a broken service on `develop` the day a
      # new dependency is added without the list. The libraries' own gates and tests are
      # libs-ci's.
      #
      # `holahost/templates/service` is deliberately NOT matched, and nothing below installs
      # it: the template is a tree to copy from, and what has to pass the gates is the copy,
      # in the service that made it. The repo-root hooks skip `templates/` for the same
      # reason.
      #
      # The first push of a new branch has no `before` (GitHub sends zeros), so the base falls
      # back to where the branch left `develop`. Not the root commit: a diff from the root
      # matches every filter, and every service's pipeline would run in full on a branch that
      # touches none of them.
      - name: Detect rag-documents changes
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git merge-base origin/develop HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$base" HEAD | grep -qE '^(holahost/(services/rag-documents|libs/holahost-[a-z]+|make|infra/modules)/|\.github/(actions/|workflows/rag-documents-)|\.pre-commit-config\.yaml$|\.tool-versions$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-python-toolchain
        if: steps.filter.outputs.changed == 'true'

      # Only this service's own package is installed. The libraries it path-depends on come into
      # this same venv from the checkout (`develop = true`), which is all its mypy run and its
      # tests need; the libraries' own venvs are libs-ci's.
      - name: Install dependencies (rag-documents backend)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: poetry install

      # The four Python hooks are skipped here and run as the next step instead. They walk every
      # package with a pyproject.toml, whatever the PR touched — right on a contributor's machine,
      # where a library change should be checked against every service before the push, and
      # wrong in a pipeline: it would have to install every other package's venv (a fresh
      # runner has none, and `poetry run` in an empty one reports "Command not found: ruff"),
      # and it would gate code this pipeline does not own.
      - name: Pre-commit (generic hooks over this service's changed files)
        if: steps.filter.outputs.changed == 'true'
        env:
          SKIP: python-ruff,python-ruff-format,python-mypy,python-import-linter
        run: |
          pip install pre-commit
          pre-commit run --files $(git diff --name-only "${{ steps.filter.outputs.base }}" HEAD -- holahost/services/rag-documents)

      # The same four tools as the skipped hooks, check-only, on this package alone. Not
      # conditional on which files changed: when only a library did, this is the step that
      # checks the service against it.
      - name: Python gates (rag-documents backend)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .
          poetry run lint-imports

      - name: Unit tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: poetry run pytest -m "not integration"

      - name: Integration tests (testcontainers — needs Docker)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/backend
        run: poetry run pytest -m integration

      # The published contract, checked like any other generated artifact. Regenerating and
      # diffing (rather than trusting the committed file) is what makes it a check at all: a
      # renamed route or a field that quietly became optional is a change to what callers
      # integrate against, and without this it reaches them as a surprise instead of a diff.
      - name: OpenAPI schema is current
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents
        run: make openapi-check

      - name: Docker build (no push)
        if: steps.filter.outputs.changed == 'true'
        run: |
          PYTHON_VERSION=$(awk '$1=="python"{print $2}' .tool-versions)
          docker build -f holahost/services/rag-documents/Dockerfile \
            --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
            -t rag-documents:ci .

      # The size budget, checked where it can still be acted on. The image carries an embedding
      # model's runtime plus its dependencies, and nothing else warns when a transitive
      # dependency, a stray cache directory, or the model weights themselves start riding along —
      # a `.dockerignore` gap is invisible until someone lists the image by hand. The ceiling is
      # deliberately loose: a tripwire against order-of-magnitude drift, not a budget to optimise
      # against.
      - name: Image size budget
        if: steps.filter.outputs.changed == 'true'
        env:
          MAX_IMAGE_MB: 900
        run: |
          set -euo pipefail
          size_mb=$(( $(docker image inspect rag-documents:ci --format '{{.Size}}') / 1000000 ))
          echo "rag-documents:ci is ${size_mb} MB (ceiling ${MAX_IMAGE_MB} MB)"
          if [ "$size_mb" -gt "$MAX_IMAGE_MB" ]; then
            echo "::error::image grew past its size budget — check .dockerignore and new dependencies"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.filter.outputs.changed == 'true'

      # `validate` is the baseline that always runs: it needs no credentials and no state, so it
      # works on a fork PR and on a machine with no AWS at all. It cannot see drift, though —
      # it never reads state, so a resource changed by hand in the console passes it untouched.
      # `terraform plan` below is what catches that; the two are a pair, not alternatives.
      - name: Terraform validate (common)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/infra/common
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (envs/staging)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/infra/envs/staging
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (envs/prod)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/rag-documents/infra/envs/prod
        run: terraform init -backend=false && terraform validate

      # A real plan reads the S3 state backend and calls the provider APIs, so it needs
      # credentials — a read-only OIDC role of its own, never the deploy roles: a pull request,
      # including one from a fork, must not be able to reach a role that can change anything.
      #
      # Two conditions gate it, and both are needed for different reasons:
      #
      #   vars.AWS_ACCOUNT_ID != ''    the platform AWS account and this role do not exist yet
      #                                (same dependency the placeholder ARNs in deploy-staging/
      #                                promote-prod carry). Setting the repository variable is
      #                                what turns these steps on — no workflow edit needed.
      #   ...fork != true              a fork PR gets no secrets and no OIDC token by GitHub's
      #                                own design, so the step could only fail. It is skipped,
      #                                and a skipped step reports success — which is what a
      #                                required check needs, rather than being stuck red on
      #                                every outside contribution.
      #
      # `plan` exits 0 whether or not there is a diff; drift shows up as a non-empty plan in the
      # log, which is the point. `-lock=false` because reading state for a plan should never
      # block a concurrent apply.
      - name: Configure AWS credentials (read-only, for plan)
        id: aws
        if: >-
          steps.filter.outputs.changed == 'true'
          && vars.AWS_ACCOUNT_ID != ''
          && github.event.pull_request.head.repo.fork != true
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-rag-documents-plan

      - name: Terraform plan (common)
        if: steps.aws.outcome == 'success'
        working-directory: holahost/services/rag-documents/infra/common
        run: terraform init && terraform plan -lock=false -input=false

      - name: Terraform plan (envs/staging)
        if: steps.aws.outcome == 'success'
        working-directory: holahost/services/rag-documents/infra/envs/staging
        run: terraform init && terraform plan -lock=false -input=false

      - name: Terraform plan (envs/prod)
        if: steps.aws.outcome == 'success'
        working-directory: holahost/services/rag-documents/infra/envs/prod
        run: terraform init && terraform plan -lock=false -input=false

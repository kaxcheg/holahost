name: rag-documents-promote-prod

# The trigger and this service's values; the pipeline is service-promote-prod.yml.

on:
  push:
    tags: ["rag-documents/v*"]

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    uses: ./.github/workflows/service-promote-prod.yml
    with:
      service: rag-documents

name: rag-documents-promote-prod

on:
  push:
    tags: ["rag-documents/v*"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          # Same ACCOUNT_ID caveat as deploy-staging.yml — pending platform AWS account/OIDC setup.
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-rag-documents-prod
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: holahost/services/rag-documents/infra/common

      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: holahost/services/rag-documents/infra/envs/prod

      # Resolve by the commit's sha tag, not by a branch-derived tag: the git tag this workflow
      # runs on points at exactly one commit, and deploy-staging pushed that commit's image as
      # `git-<sha>` — so the sha tag is a direct, unambiguous handle on the image staging actually
      # validated. A tag shared by every commit of a release branch would be ambiguous about which
      # build shipped, and unpushable twice on an immutable repository.
      #
      # `describe-images`, not `docker pull` + `docker inspect`: the digest is registry metadata,
      # so there is no reason to pull the whole (torch-sized) image onto the runner to read it —
      # nothing here ever runs the image, the instance pulls it itself by digest.
      - name: Resolve digest by commit (no rebuild — build-once/promote-by-digest)
        id: resolve
        run: |
          set -euo pipefail
          REPO=$(terraform -chdir=holahost/services/rag-documents/infra/common output -raw repository_url)
          # The same full sha deploy-staging writes. GITHUB_SHA here is the commit the
          # `<svc>/v*` git tag points at, which is why that tag belongs on the `release/v*`
          # commit that passed staging: a squash merge into `main` produces a new sha for which
          # no image was ever built.
          SHA_TAG="git-${GITHUB_SHA}"
          DIGEST=$(aws ecr describe-images \
            --repository-name "${REPO##*/}" \
            --image-ids imageTag="$SHA_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "No image tagged $SHA_TAG in ${REPO##*/} — this commit was never deployed to staging." >&2
            echo "Tag a commit that deploy-staging has already built, then re-run." >&2
            exit 1
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "digest=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ssm-migrate-deploy
        with:
          env: prod
          service-name: rag-documents
          image: ${{ steps.resolve.outputs.digest }}
          compose-file: holahost/services/rag-documents/docker-compose.yml
          env-file: holahost/services/rag-documents/infra/envs/prod/.env

      - uses: ./.github/actions/smoke-check
        with:
          url: https://hola.host/api/rag-documents/health

      # Only now, after the deploy is live and answering, does the version tag get applied — so
      # `release-vYYYYMMDD.N` in ECR means "this exact image shipped to prod", not "this was built
      # at some point". Applied by retagging the existing manifest (put-image), never by a second
      # build: the digest is unchanged, so the immutable repository accepts one new name for an
      # image it already holds. Idempotent on a re-run — an identical tag+manifest comes back as
      # ImageAlreadyExistsException, which is success for our purposes, not a failure.
      - name: Tag the shipped digest with the release version
        run: |
          set -euo pipefail
          REPO="${{ steps.resolve.outputs.repo }}"
          REPO_NAME="${REPO##*/}"
          # GITHUB_REF_NAME = "rag-documents/vYYYYMMDD.N" — the per-component version tag.
          VERSION_TAG="release-${GITHUB_REF_NAME#*/}"
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$REPO_NAME" \
            --image-ids imageDigest="${{ steps.resolve.outputs.image_digest }}" \
            --accepted-media-types \
              "application/vnd.docker.distribution.manifest.v2+json" \
              "application/vnd.oci.image.manifest.v1+json" \
            --query 'images[0].imageManifest' --output text)
          if aws ecr put-image \
               --repository-name "$REPO_NAME" \
               --image-tag "$VERSION_TAG" \
               --image-manifest "$MANIFEST" >/dev/null 2>&1; then
            echo "Tagged ${{ steps.resolve.outputs.image_digest }} as $VERSION_TAG."
          else
            echo "$VERSION_TAG already present — left as is."
          fi

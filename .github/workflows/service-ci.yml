name: service-ci

# The `ci` pipeline of every service, called from its own `<svc>-ci.yml`, which holds only the
# triggers and the service's values. GitHub runs workflows only from the root `.github/workflows/`,
# so the callers live here; the repeated steps within a job are composite actions under
# `.github/actions/`.
#
# The path check is a job-internal step, not a top-level `on.paths` filter: a workflow skipped by
# `on.paths` leaves a required check pending forever, while a job whose filter finds nothing still
# completes, green.
#
# The caller grants `id-token: write` — a called workflow can only narrow its caller's permissions —
# for the OIDC token the `terraform plan` steps exchange for the read-only AWS role.

on:
  workflow_call:
    inputs:
      service:
        description: The service's name — its directory under holahost/services/ and its prefix.
        type: string
        required: true
      checks:
        description: >-
          The service's own make targets, space-separated, run from its directory after the
          shared checks (e.g. `validate-registry`).
        type: string
        default: ""

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SERVICE: ${{ inputs.service }}
    defaults:
      run:
        working-directory: holahost/services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — needed for the diff-based path filter below

      # The filter covers the pipeline itself, not only the code it builds: a PR touching just
      # .github/actions/, one of the service's or the shared workflow files, .pre-commit-config.yaml
      # or .tool-versions would otherwise report green having built nothing. `holahost/make` and
      # `holahost/infra/modules` are matched for the same reason one step further out — a service's
      # Makefile is an `include`, and its Terraform roots are calls into those modules.
      #
      # Every library under `holahost/libs/` is matched, not only the ones the service imports
      # today: the service runs on that code, so a library change has to re-run this pipeline
      # against it — that run is what checks a dependent service. Matching all of them costs an
      # extra run now and then; matching a list costs a broken service on `develop` the day a new
      # dependency is added without the list. The libraries' own gates and tests are libs-ci's.
      #
      # `holahost/templates/service` is deliberately NOT matched, and nothing below installs it:
      # the template is a tree to copy from, and what has to pass the gates is the copy, in the
      # service that made it. The repo-root hooks skip `templates/` for the same reason.
      #
      # The first push of a new branch has no `before` (GitHub sends zeros), so the base falls back
      # to where the branch left `develop`. Not the root commit: a diff from the root matches every
      # filter, and every service's pipeline would run in full on a branch that touches none of
      # them.
      - name: Detect ${{ inputs.service }} changes
        id: filter
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git merge-base origin/develop HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$base" HEAD | grep -qE "^(holahost/(services/$SERVICE|libs/[^/]+|make|infra/modules)/|\.github/(actions/|workflows/($SERVICE-|service-))|\.pre-commit-config\.yaml$|\.tool-versions$)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-python-toolchain
        if: steps.filter.outputs.changed == 'true'

      # Only this service's own package is installed. The libraries it path-depends on come into
      # this same venv from the checkout (`develop = true`), which is all its mypy run and its tests
      # need; the libraries' own venvs are libs-ci's.
      - name: Install dependencies (${{ inputs.service }} backend)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/${{ inputs.service }}/backend
        run: poetry install

      # The four Python hooks are skipped here and run as the next step instead. They walk every
      # package with a pyproject.toml, whatever the PR touched — right on a contributor's machine,
      # where a library change should be checked against every service before the push, and wrong
      # in a pipeline: it would have to install every other package's venv (a fresh runner has
      # none, and `poetry run` in an empty one reports "Command not found: ruff"), and it would gate
      # code this pipeline does not own.
      - name: Pre-commit (generic hooks over this service's changed files)
        if: steps.filter.outputs.changed == 'true'
        working-directory: .
        env:
          SKIP: python-ruff,python-ruff-format,python-mypy,python-import-linter
        run: |
          pip install pre-commit
          pre-commit run --files $(git diff --name-only "${{ steps.filter.outputs.base }}" HEAD -- "holahost/services/$SERVICE")

      # The same four tools as the skipped hooks, check-only, on this package alone. Not
      # conditional on which files changed: when only a library did, this is the step that checks
      # the service against it.
      - name: Python gates (${{ inputs.service }} backend)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/${{ inputs.service }}/backend
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .
          poetry run lint-imports

      - name: Unit tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/${{ inputs.service }}/backend
        run: poetry run pytest -m "not integration"

      - name: Integration tests (testcontainers — needs Docker)
        if: steps.filter.outputs.changed == 'true'
        working-directory: holahost/services/${{ inputs.service }}/backend
        run: poetry run pytest -m integration

      # The published contract, checked like any other generated artifact. Regenerating and diffing
      # (rather than trusting the committed file) is what makes it a check at all: a renamed route
      # or a field that quietly became optional is a change to what callers integrate against, and
      # without this it reaches them as a surprise instead of a diff.
      - name: OpenAPI schema is current
        if: steps.filter.outputs.changed == 'true'
        run: make openapi-check

      - name: The service's own checks
        if: steps.filter.outputs.changed == 'true' && inputs.checks != ''
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          for target in $CHECKS; do
            make "$target"
          done

      # The size budget, checked where it can still be acted on: nothing else warns when a
      # transitive dependency, a stray cache directory or a model file starts riding along — a
      # `.dockerignore` gap is invisible until someone lists the image by hand. `make ci-image` so
      # the ceiling has one home, the service's Makefile (`MAX_IMAGE_MB`), which a contributor's
      # local run reads too.
      - name: Docker build (no push) and the image size budget
        if: steps.filter.outputs.changed == 'true'
        run: make ci-image

      - uses: hashicorp/setup-terraform@v3
        if: steps.filter.outputs.changed == 'true'

      # `validate` is the baseline that always runs: it needs no credentials and no state, so it
      # works on a fork PR and on a machine with no AWS at all. It cannot see drift, though — it
      # never reads state, so a resource changed by hand in the console passes it untouched.
      # `terraform plan` below is what catches that; the two are a pair, not alternatives.
      - name: Terraform validate (common, envs/staging, envs/prod)
        if: steps.filter.outputs.changed == 'true'
        run: make ci-tf

      # A real plan reads the S3 state backend and calls the provider APIs, so it needs credentials
      # — a read-only OIDC role of its own, never the deploy roles: a pull request, including one
      # from a fork, must not be able to reach a role that can change anything.
      #
      # Two conditions gate it, and both are needed for different reasons:
      #
      #   vars.AWS_ACCOUNT_ID != ''    the platform AWS account and this role do not exist yet.
      #                                Setting the repository variable is what turns these steps
      #                                on — no workflow edit needed.
      #   ...fork != true              a fork PR gets no secrets and no OIDC token by GitHub's own
      #                                design, so the step could only fail. It is skipped, and a
      #                                skipped step reports success — which is what a required
      #                                check needs, rather than being stuck red on every outside
      #                                contribution.
      #
      # `plan` exits 0 whether or not there is a diff; drift shows up as a non-empty plan in the
      # log, which is the point. `-lock=false` because reading state for a plan should never block a
      # concurrent apply.
      - name: Configure AWS credentials (read-only, for plan)
        id: aws
        if: >-
          steps.filter.outputs.changed == 'true'
          && vars.AWS_ACCOUNT_ID != ''
          && github.event.pull_request.head.repo.fork != true
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-${{ inputs.service }}-plan

      - name: Terraform plan (common)
        if: steps.aws.outcome == 'success'
        working-directory: holahost/services/${{ inputs.service }}/infra/common
        run: terraform init && terraform plan -lock=false -input=false

      - name: Terraform plan (envs/staging)
        if: steps.aws.outcome == 'success'
        working-directory: holahost/services/${{ inputs.service }}/infra/envs/staging
        run: terraform init && terraform plan -lock=false -input=false

      - name: Terraform plan (envs/prod)
        if: steps.aws.outcome == 'success'
        working-directory: holahost/services/${{ inputs.service }}/infra/envs/prod
        run: terraform init && terraform plan -lock=false -input=false

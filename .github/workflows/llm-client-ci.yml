name: llm-client-ci

# The triggers and this service's values; the pipeline is service-ci.yml.

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: ["feature/**", "bugfix/**", "refactor/**", "chore/**", "docs/**", "test/**"]

permissions:
  contents: read
  id-token: write # the read-only OIDC role of the `terraform plan` steps

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: llm-client
      # The registry is read once, at startup, and an error in it stops the process there — on the
      # instance, after the old container is gone. This runs the same check where it costs a red
      # pull request instead.
      checks: validate-registry

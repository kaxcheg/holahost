name: llm-client-promote-prod

# The trigger and this service's values; the pipeline is service-promote-prod.yml.

on:
  push:
    tags: ["llm-client/v*"]

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    uses: ./.github/workflows/service-promote-prod.yml
    with:
      service: llm-client
      # The paid generation, as in llm-client-deploy-staging.yml.
      smoke-path: /generate
      smoke-body: '{"model": "fast", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 1}'
      smoke-summary: "{provider, model, usage}"
      smoke-secret-prefix: LLM_CLIENT

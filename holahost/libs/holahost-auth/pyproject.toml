[project]
name = "holahost-auth"
version = "0.1.0"
description = "Offline JWT validation for Holahost services (platform shared library)."
requires-python = ">=3.12,<4.0"
readme = "README.md"

[tool.poetry]
packages = [{ include = "holahost_auth" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pyjwt = { extras = ["crypto"], version = "^2.13" }
# `AuthConfig` loads itself from the environment: the five variables it declares are a
# platform contract, not a per-service choice, so the declaration belongs with the
# validator that consumes them. pydantic itself already arrives with fastapi below.
pydantic-settings = "^2.7"
fastapi = "^0.115"
# For the shared error/rejection contract only (RejectionLogger). The dependency
# runs http -> auth and never back: holahost-http knows nothing about tokens, and
# describes the caller it rate-limits by a structural protocol instead.
holahost-http = { path = "../holahost-http", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-httpserver = "^1.1"
werkzeug = "^3.1"
httpx = "^0.27"
ruff = "^0.8"
mypy = "^1.13"
import-linter = "^2.1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's whole assertion idiom is bare `assert`; S101 targets production code
# where asserts get stripped under `-O`, not test files.
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
# Without this, mypy treats every pydantic-settings field as a required constructor kwarg
# (it does not know BaseSettings populates them from os.environ, not __init__ args).
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "holahost_auth"

[[tool.importlinter.contracts]]
name = "Leaf modules stay dependency-free"
type = "independence"
modules = [
    "holahost_auth.config",
    "holahost_auth.context",
    "holahost_auth.exceptions",
]

[[tool.importlinter.contracts]]
# The FastAPI dependency reads what the middleware stored; the middleware must never
# reach back for it. One validation path, and this is what keeps it that way.
name = "Validation flows middleware -> dependency, never back"
type = "forbidden"
source_modules = ["holahost_auth.middleware"]
forbidden_modules = ["holahost_auth.dependency"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

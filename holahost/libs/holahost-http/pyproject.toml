[project]
name = "holahost-http"
version = "0.1.0"
description = "Shared HTTP edge for Holahost services: error envelope and pre-routing middleware."
requires-python = ">=3.12,<4.0"
readme = "README.md"

[tool.poetry]
packages = [{ include = "holahost_http" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# The pre-routing middleware is plain ASGI and needs only starlette — that half of the
# package exists precisely because it cannot be expressed with FastAPI's Depends().
starlette = ">=0.40,<1.0"
# The other half — the exception handlers and the published error schemas — is FastAPI
# by nature: `@app.exception_handler`, `RequestValidationError` and the schema generator
# are what it is about, and every service on the platform is a FastAPI service. Declared
# as an ordinary dependency rather than an extra: an optional import that every consumer
# turns on is a switch nobody ever flips the other way.
fastapi = "^0.115"
# For the completion event a rejection and a handled failure both write. The direction
# runs observability -> http and never back: the logger knows nothing about HTTP.
holahost-observability = { path = "../holahost-observability", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.28"
ruff = "^0.8"
mypy = "^1.13"
import-linter = "^2.1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's whole assertion idiom is bare `assert`; S101 targets production code
# where asserts get stripped under `-O`, not test files.
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.importlinter]
root_package = "holahost_http"

[[tool.importlinter.contracts]]
name = "Middleware depends on the envelope, never on each other"
type = "independence"
modules = [
    "holahost_http.body_limit",
    "holahost_http.rate_limit",
    "holahost_http.request_id",
]

[[tool.importlinter.contracts]]
# The two halves of the package answer at different moments — before routing, and after
# a route raised — and neither needs the other. Keeping them apart is what stops the
# ASGI half quietly acquiring a FastAPI import and becoming impossible to run without an
# application object.
name = "The pre-routing half and the handler half stay independent"
type = "forbidden"
source_modules = [
    "holahost_http.body_limit",
    "holahost_http.rate_limit",
    "holahost_http.request_id",
]
forbidden_modules = [
    "holahost_http.edge",
    "holahost_http.error_handlers",
    "holahost_http.error_schemas",
    "holahost_http.security",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

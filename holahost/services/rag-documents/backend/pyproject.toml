[project]
name = "rag-documents"
version = "0.1.0"
description = "RAG document ingestion and search microservice."
requires-python = ">=3.12,<4.0"

[tool.poetry]
# Explicit src-layout packaging (app/domain -> importable as bare `domain`).
# `package-mode = false` was tried first and reverted: it skips installing the
# project's own code into the venv entirely, which works for pytest/mypy (they
# have their own pythonpath/mypy_path settings) but leaves import-linter unable
# to find `domain` at all — it has no config-level path option, only real
# Python import resolution. Real packaging fixes that for every tool uniformly,
# including a developer running `poetry run lint-imports` by hand.
packages = [
    { include = "domain", from = "app" },
    { include = "application", from = "app" },
    { include = "infrastructure", from = "app" },
    { include = "config", from = "app" },
    { include = "interface", from = "app" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
sqlalchemy = "^2.0"
psycopg = {extras = ["binary", "pool"], version = "^3.2"}
alembic = "^1.14"
pgvector = ">=0.3,<1.0"
fastembed = ">=0.4,<1.0"
numpy = ">=2.4,<3"
langchain-text-splitters = ">=0.3,<1.0"
# Imported directly by infrastructure/ingestion/recursive_text_chunker.py
# (`langchain_core.documents.Document`), so it is declared here rather than relied on
# as langchain-text-splitters' transitive dependency: the day the splitter stops
# pulling it — or moves the module — `poetry lock` resolves cleanly and the container
# fails at import time inside `bootstrap()`, instead of failing in CI's resolution.
# Range mirrors what langchain-text-splitters itself accepts, so declaring it changes
# nothing about what gets resolved today.
langchain-core = ">=0.3.75,<2.0"
pymupdf = ">=1.24,<2"
python-docx = "^1.1"
boto3 = "^1.35"
pydantic-settings = "^2.7"
python-json-logger = "^3.2"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
python-multipart = "^0.0.20"
holahost-auth = {path = "../../../libs/holahost-auth", develop = true}
holahost-http = {path = "../../../libs/holahost-http", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.8"
mypy = "^1.13"
import-linter = "^2.1"
testcontainers = {extras = ["postgres"], version = "^4.9"}
boto3-stubs = {extras = ["secretsmanager"], version = "^1.35"}
httpx = "^0.28"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "app" resolves domain/application as bare imports; "." resolves `tests` itself as
# a namespace package (PEP 420, no __init__.py needed) so `tests._support.*` test
# helpers are importable — needed once application-layer tests share fakes/builders,
# unlike the domain-layer tests, which don't cross files and got by without it.
pythonpath = ["app", "."]
# Default "prepend" mode inserts each test file's first __init__.py-less ancestor
# directory into sys.path — with `tests/unit/application/{exceptions,dto}/` both
# lacking one, that ancestor is `tests/unit/`, which then shadows the real
# top-level `application` package with the *directory* `tests/unit/application/`.
# importlib mode collects test files by exact path instead, sidestepping sys.path
# entirely for collection (pytest's own recommended fix for this bug class).
addopts = "--import-mode=importlib"
markers = [
    "integration: requires a real Postgres via testcontainers (Docker); excluded from the fast unit run",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's whole assertion idiom is bare `assert`; S101 targets production code
# where asserts get stripped under `-O`, not test files. S105/S106/S107 (hardcoded
# password/secret string checks) are ignored here too: tests exercise the secret-
# loading adapter with fake secret literals, which read identically to a real leak
# to that checker.
"tests/*" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["app", "."]
# Without this, mypy treats every pydantic-settings field as a required constructor
# kwarg (it doesn't know BaseSettings populates them from os.environ, not __init__
# args) — matches ~/repos/lead-capture's own pyproject.toml, which hit the same issue.
plugins = ["pydantic.mypy"]
# Same bug class as pytest's --import-mode=importlib fix above, hit independently:
# mypy has its own file-to-module resolution, unrelated to pytest's addopts, and by
# default walks up through __init__.py-less directories the same way pytest's old
# "prepend" mode did — `tests/unit/domain/test_exceptions.py` and
# `tests/unit/application/exceptions/test_exceptions.py` both resolve to the bare
# name `test_exceptions` and collide ("Duplicate module named..."). Fix: explicit,
# path-based module names instead of the __init__.py-walk heuristic.
namespace_packages = true
explicit_package_bases = true

# python-docx / pymupdf / langchain_text_splitters ship no type stubs; strict = true
# otherwise treats a missing-stub import as an error. fastembed does NOT belong here
# — it ships a real py.typed marker + full annotations (verified: `mypy --strict` on
# a standalone `reveal_type(TextEmbedding().embed(...))` resolves a precise
# Iterable[NDArray[...]] union with no override at all).
[[tool.mypy.overrides]]
module = ["docx.*", "pymupdf.*", "langchain_text_splitters.*"]
ignore_missing_imports = true

# python-docx and pymupdf ship partial/incomplete stubs (not just "no stubs at all" —
# ignore_missing_imports above covers that case): some of their own calls are
# themselves untyped. strict = true's disallow_untyped_calls flags this at the CALL
# SITE, so the override targets our own modules that call into them, not the
# third-party modules themselves (a per-module override only changes how mypy checks
# files belonging to that module — docx/pymupdf source isn't part of this project).
[[tool.mypy.overrides]]
module = ["infrastructure.ingestion.*", "tests.unit.infrastructure.ingestion.*"]
disallow_untyped_calls = false

[tool.importlinter]
# `config` is listed here (import-linter needs every top-level package it should
# recognize) but stays out of the `layers` contract below: it's a leaf-exception
# (CLAUDE.md project convention) — every layer may import it, it imports nothing
# from domain/application/infrastructure/interface. `scripts/` (composition root,
# R-24) stays outside the contract entirely.
root_packages = ["domain", "application", "infrastructure", "config", "interface"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "interface",
    "infrastructure",
    "application",
    "domain",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

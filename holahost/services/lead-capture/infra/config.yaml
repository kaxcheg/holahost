# Intrinsic config of the lead-capture microservice (environment-INVARIANT, owned by the service).
# The hosting app (Holahost) chooses the environment and injects placement + platform values (env,
# name_prefix, region, image, frontend bucket/origin, keys) as module inputs — see main.tf variables.
# The app-level platform config lives at holahost/infra/config.yaml.

# Server-side secret keys (value-less SM containers named holahost/<env>/<key>; values set out-of-band).
# Mirror of SERVER_SIDE_SECRET_KEYS in backend/app/scripts/sm_loader.py.
secret_keys: [database_url, resend_api_key, ip_hash_salt, sample_server_api_key]

# Per-env resource sizing the service DECLARES (the app picks which env to apply). recovery_window is
# the SM deletion window (staging recreates freely; prod keeps a 30-day window).
envs:
  staging:
    recovery_window_in_days:  0
    log_retention_days:       14
    lambda_api_memory_mb:     2048 # embedding model baked into the image → needs RAM
    lambda_api_timeout_s:     60   # LLM_TIMEOUT_SECONDS=30 + margin
    lambda_cleanup_memory_mb: 512
    lambda_cleanup_timeout_s: 120
  prod:
    recovery_window_in_days:  30
    log_retention_days:       30
    lambda_api_memory_mb:     2048
    lambda_api_timeout_s:     60
    lambda_cleanup_memory_mb: 512
    lambda_cleanup_timeout_s: 120

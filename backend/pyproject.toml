[project]
name = "holahost-backend"
version = "0.1.0"
description = "hola.host backend (Python 3.12, clean architecture)"
authors = [{ name = "kaxcheg", email = "kaxcheg@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
    "numpy>=2.4.6,<3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.13"
mypy = ">=1.17"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

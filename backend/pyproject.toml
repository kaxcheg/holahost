[project]
name = "holahost-backend"
version = "0.1.0"
description = "hola.host backend (Python 3.12, clean architecture)"
authors = [{ name = "kaxcheg", email = "kaxcheg@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
    "numpy>=2.4.6,<3",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-json-logger>=3.1,<4",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "fastembed>=0.4,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "boto3>=1.35,<2",
    "python-multipart>=0.0.20,<0.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.13"
mypy = ">=1.17"
testcontainers = {extras = ["postgres"], version = ">=4.0,<5"}
import-linter = ">=2.0,<3"
boto3-stubs = {extras = ["secretsmanager", "s3"], version = ">=1.35,<2"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
markers = [
    "integration: requires a real Postgres via testcontainers (Docker); excluded from the fast unit run",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
plugins = ["pydantic.mypy"]

# Third-party packages without type stubs (strict=true treats `import-untyped` as an error).
# fastembed / python-docx ship no stubs; pymupdf / langchain_text_splitters vary by version.
[[tool.mypy.overrides]]
module = ["fastembed.*", "docx.*", "pymupdf.*", "langchain_text_splitters.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["application", "domain", "infrastructure", "config", "interface"]

# Clean Architecture dependency rule, expressed by LAYER (not by framework): a higher layer may import
# lower ones, never the reverse. application/domain therefore cannot import infrastructure/interface;
# since the heavy frameworks (langchain, fastembed, anthropic, ...) are confined to infrastructure
# adapters, this keeps them out of the pure layers without enumerating any framework. `config` is a
# cross-cutting leaf (pure pydantic-settings) and stays out of the hierarchy.
# `interface` (the web/API layer — handler/router/request-parsing/response-envelope, which imports
# infrastructure to wire adapters) is the outermost layer. It now exists (B-46–B-50), so it is a
# required (non-optional) layer in the contract. The composition root lives in `scripts/` and stays
# OUTSIDE the layering (not a root_package): it legitimately imports every layer to assemble the DI graph.
[[tool.importlinter.contracts]]
name = "Clean Architecture layers (interface > infrastructure > application > domain)"
type = "layers"
layers = ["interface", "infrastructure", "application", "domain"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Repo-global quality gates. Bypassing hooks with `git commit --no-verify` is forbidden by policy;
# CI re-runs the same set. Language/service-specific hooks (lint, types, tests) are added per
# service/component as they land — the generic set below applies repo-wide.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without an explicit `stages` run only at pre-commit; conventional-pre-commit opts into commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, refactor, docs, test, build, ci]

  # One set of hooks for every Python package in the repo (any dir with its own
  # pyproject.toml), auto-discovered — not one hook block per package. Each
  # package still runs in its own `poetry run` venv, so mypy/ruff see that
  # package's real installed dependencies rather than a shared guess. Adding a
  # new package (rag-documents' backend, llm-client, ...) needs no edit here.
  #
  # `holahost/templates/` is excluded: the service template is a tree to copy from, not code
  # that runs anywhere. What has to pass these gates is the copy, inside the service that made
  # it. Gating on the template instead would make every contributor's machine and every
  # service's CI install a package nobody deploys. It stays a real package, so its own
  # `make lint`, `make test` and `make openapi-check` still work when someone edits it.
  #
  # Excluding it takes BOTH lines below, and they do different jobs:
  #   `exclude:`             stops the hook running when a change touches nothing else.
  #   `-not -path templates` stops the loop entering the template when it runs anyway.
  # `exclude` cannot do the second: with `pass_filenames: false` the matched file list is
  # discarded, and `entry` is a fixed string that re-derives the packages itself.
  - repo: local
    hooks:
      - id: python-ruff
        name: python · ruff check (all packages)
        entry: bash -c 'for d in $(find holahost -name pyproject.toml -not -path "*/.venv/*" -not -path "*/templates/*" | xargs -n1 dirname); do (cd "$d" && poetry run ruff check --fix .) || exit 1; done'
        language: system
        files: \.py$|pyproject\.toml$
        pass_filenames: false
        exclude: ^holahost/templates/
      - id: python-ruff-format
        name: python · ruff format (all packages)
        entry: bash -c 'for d in $(find holahost -name pyproject.toml -not -path "*/.venv/*" -not -path "*/templates/*" | xargs -n1 dirname); do (cd "$d" && poetry run ruff format .) || exit 1; done'
        language: system
        files: \.py$|pyproject\.toml$
        pass_filenames: false
        exclude: ^holahost/templates/
      - id: python-mypy
        name: python · mypy (all packages)
        entry: bash -c 'for d in $(find holahost -name pyproject.toml -not -path "*/.venv/*" -not -path "*/templates/*" | xargs -n1 dirname); do (cd "$d" && poetry run mypy .) || exit 1; done'
        language: system
        files: \.py$|pyproject\.toml$
        pass_filenames: false
        exclude: ^holahost/templates/
      - id: python-import-linter
        name: python · import-linter (all packages)
        entry: bash -c 'for d in $(find holahost -name pyproject.toml -not -path "*/.venv/*" -not -path "*/templates/*" | xargs -n1 dirname); do (cd "$d" && poetry run lint-imports) || exit 1; done'
        language: system
        files: \.py$|pyproject\.toml$
        pass_filenames: false
        exclude: ^holahost/templates/
